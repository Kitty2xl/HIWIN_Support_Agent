<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HIWIN Support Agent — demo</title>
<!-- Markdown renderer (CDN). Vendor this file locally if the browser is offline. -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 880px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
  h1 { font-size: 1.25rem; }
  .note { color: #888; font-size: .85rem; margin: -.4rem 0 1rem; }
  textarea { width: 100%; min-height: 80px; padding: .6rem; font-size: 1rem; box-sizing: border-box; }
  .row { display: flex; gap: .5rem; align-items: center; margin: .6rem 0; }
  select, button { padding: .5rem .8rem; font-size: 1rem; }
  button { cursor: pointer; }
  #status { color: #666; font-size: .9rem; margin: .5rem 0; min-height: 1.2em; }
  #answer { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-top: 1rem; }
  #answer:empty { display: none; }
  #answer table { border-collapse: collapse; margin: .5rem 0; }
  #answer th, #answer td { border: 1px solid #ccc; padding: .3rem .55rem; }
  #answer img { max-width: 100%; height: auto; display: block; margin: .6rem 0; border: 1px solid #eee; }
  #sources { margin-top: 1rem; font-size: .9rem; color: #333; }
  #sources li { margin: .2rem 0; }
  code { background: #f3f3f3; padding: .1rem .3rem; border-radius: 4px; }

  /* --- Debug panel --- */
  #debug { margin-top: 1rem; font-size: .85rem; }
  #debug[hidden] { display: none; }
  #debug .panel { border: 1px solid #d9d9e3; border-radius: 8px; background: #fbfbfd; padding: .8rem 1rem; }
  #debug h2 { font-size: .95rem; margin: 0 0 .5rem; }
  .dbg-metrics { display: flex; flex-wrap: wrap; gap: .3rem .9rem; margin-bottom: .8rem; color: #333; }
  .dbg-metrics .kv b { color: #555; font-weight: 600; }
  .dbg-trace { list-style: none; margin: 0; padding: 0; counter-reset: step; }
  .dbg-trace > li { border-left: 3px solid #c7c7d1; padding: .35rem 0 .6rem .7rem; margin-left: .3rem; position: relative; }
  .dbg-trace > li::before { counter-increment: step; content: counter(step); position: absolute; left: -.75rem; top: .3rem;
    background: #6a6a80; color: #fff; border-radius: 50%; width: 1.15rem; height: 1.15rem; font-size: .7rem;
    display: flex; align-items: center; justify-content: center; }
  .dbg-tool { font-weight: 600; font-family: ui-monospace, Menlo, Consolas, monospace; color: #2a2a55; }
  .dbg-args { margin: .2rem 0; }
  .dbg-arg { display: inline-block; background: #ececf4; border-radius: 4px; padding: .05rem .35rem; margin: .1rem .25rem .1rem 0;
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .8rem; }
  .dbg-result { background: #fff; border: 1px solid #e3e3ea; border-radius: 6px; padding: .4rem .55rem; margin: .3rem 0 0;
    max-height: 220px; overflow: auto; white-space: pre-wrap; word-break: break-word; font-size: .78rem; color: #333; }
  .dbg-empty { color: #b00; font-style: italic; }
  #debug pre.raw { max-height: 320px; overflow: auto; background: #fff; border: 1px solid #e3e3ea; border-radius: 6px; padding: .5rem; }
  #debug details { margin-top: .8rem; }
  #debug summary { cursor: pointer; color: #444; }
  .toggle { font-size: .85rem; color: #555; margin-left: auto; display: flex; align-items: center; gap: .3rem; }
</style>
</head>
<body>
  <h1>HIWIN Support Agent — demo</h1>
  <p class="note">Example frontend for the HIWIN Support Agent Backend. The service is API-first; this page just calls <code>POST /chat</code>.</p>
  <textarea id="prompt" placeholder="Ask about a HIWIN product…">HGW20 load capacity</textarea>
  <div class="row">
    <label>Language:
      <select id="language">
        <option value="en">English (en)</option>
        <option value="jp">日本語 (jp)</option>
        <option value="tc">繁體中文 (tc)</option>
        <option value="sc">简体中文 (sc)</option>
      </select>
    </label>
    <button id="send">Send</button>
    <span style="font-size:.8rem;color:#999">Ctrl+Enter to send</span>
    <label class="toggle"><input type="checkbox" id="debugToggle" checked> Debug view</label>
  </div>
  <div id="status"></div>
  <div id="answer"></div>
  <div id="sources"></div>
  <div id="debug" hidden></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

async function send() {
  const prompt = $('prompt').value.trim();
  const language = $('language').value;
  if (!prompt) return;

  $('send').disabled = true;
  $('status').textContent = 'Thinking… (retrieval + model; a cold model load can take ~20s)';
  $('answer').innerHTML = '';
  $('sources').innerHTML = '';
  $('debug').innerHTML = '';

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt, language }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    // Same-origin: image src="/static/HIWIN/..." in the markdown resolves to this backend.
    $('answer').innerHTML = marked.parse(data.response || '');
    renderSources(data.sources || []);
    renderDebug(data);

    const tools = (data.trace || []).map((t) => t.tool).join(', ') || '(none)';
    $('status').textContent = 'Done — language: ' + (data.language || '') + ' · tools: ' + tools;
  } catch (e) {
    $('status').textContent = 'Error: ' + e.message;
  } finally {
    $('send').disabled = false;
  }
}

function renderSources(srcs) {
  if (!srcs.length) { $('sources').innerHTML = ''; return; }
  $('sources').innerHTML = '<strong>Sources</strong><ul>' + srcs.map((s) => {
    const score = (s.rerank_score != null) ? ' <code>score ' + s.rerank_score + '</code>' : '';
    const label = s.web_path
      ? '<a href="' + esc(s.web_path) + '" target="_blank">' + esc(s.file_name || s.web_path) + '</a>'
      : esc([s.product_type, s.page_number ? 'p.' + s.page_number : '', s.file_name].filter(Boolean).join(' — '));
    return '<li>' + label + score + '</li>';
  }).join('') + '</ul>';
}

function renderDebug(data) {
  const m = data.metrics || {};
  const trace = data.trace || [];
  const kv = (k, v) => '<span class="kv"><b>' + k + ':</b> ' + esc(v == null ? '—' : v) + '</span>';

  let html = '<div class="panel"><h2>Debug — agent trace</h2>';

  html += '<div class="dbg-metrics">'
    + kv('language', data.language)
    + kv('iterations', m.agent_iterations)
    + kv('tool calls', m.tool_calls)
    + kv('llm calls', m.llm_calls)
    + kv('completeness calls', m.completeness_calls)
    + kv('tokens (p+c=t)', (m.prompt_tokens || 0) + '+' + (m.completion_tokens || 0) + '=' + (m.total_tokens || 0))
    + kv('latency', (m.latency_ms != null ? m.latency_ms + ' ms' : '—'))
    + '</div>';

  // Where the wall clock actually went, per call kind (agent loop vs. vision vs.
  // completeness vs. embed/rerank). Concurrent calls are summed, so these can
  // total more than latency — read them against each other, not against latency.
  const byKind = m.by_kind || {};
  const kinds = Object.keys(byKind).sort((a, b) => byKind[b].ms - byKind[a].ms);
  if (kinds.length) {
    html += '<div class="dbg-metrics">' + kinds.map((k) => {
      const s = byKind[k];
      const err = s.errors ? ' ⚠' + s.errors : '';
      return kv(k, s.calls + '× ' + Math.round(s.ms) + ' ms' + err);
    }).join('') + '</div>';
  }

  if (!trace.length) {
    html += '<p class="dbg-empty">No tool calls were made for this request.</p>';
  } else {
    html += '<ol class="dbg-trace">' + trace.map((t) => {
      const args = t.args || {};
      const argHtml = Object.keys(args).length
        ? '<div class="dbg-args">' + Object.keys(args).map((k) =>
            '<span class="dbg-arg">' + esc(k) + '=' + esc(JSON.stringify(args[k])) + '</span>').join('') + '</div>'
        : '';
      const result = (t.result == null || t.result === '')
        ? '<div class="dbg-result dbg-empty">(empty result)</div>'
        : '<div class="dbg-result">' + esc(t.result) + '</div>';
      return '<li><div class="dbg-tool">' + esc(t.tool) + '</div>' + argHtml + result + '</li>';
    }).join('') + '</ol>';
  }

  const comp = m.completeness || [];
  if (comp.length) {
    html += '<h2 style="margin-top:.9rem">Completeness pass — per-passage enumeration</h2>';
    html += '<ol class="dbg-trace">' + comp.map((c) => {
      const badge = c.status === 'found' ? '<span style="color:#0a0">✓ found</span>'
        : c.status === 'error' ? '<span class="dbg-empty">⚠ error</span>'
        : '<span class="dbg-empty">NONE</span>';
      const body = c.output ? '<div class="dbg-result">' + esc(c.output) + '</div>' : '';
      return '<li><div class="dbg-tool">' + esc(c.source || '(passage)') + ' — ' + badge + '</div>' + body + '</li>';
    }).join('') + '</ol>';
  }

  html += '<details><summary>Raw response JSON</summary>'
    + '<pre class="raw">' + esc(JSON.stringify(data, null, 2)) + '</pre></details>';

  html += '</div>';
  $('debug').innerHTML = html;
}

function applyDebugVisibility() {
  $('debug').hidden = !$('debugToggle').checked;
}

$('send').addEventListener('click', send);
$('prompt').addEventListener('keydown', (e) => { if (e.ctrlKey && e.key === 'Enter') send(); });
$('debugToggle').addEventListener('change', applyDebugVisibility);
applyDebugVisibility();
</script>
</body>
</html>
