; ===========================================================================
; llama.cpp router-mode preset for the HIWIN Support Agent.
;
; Start the inference server in ROUTER mode (note: NO -m / model path) with:
;     llama-server --models-preset router.example.ini --host 127.0.0.1 --port 11400
; (the start.bat / start.sh launchers do this for you). The router keeps every
; model with `load-on-startup = true` resident behind ONE endpoint and routes
; each request by its "model" field — no swapping.
;
; Section name = the routable model name (must equal the backend's
; LANGUAGE_MODEL / EMBEDDING_MODEL / RERANKER_MODEL / COMPLETENESS_MODEL and the
; pipeline's MODEL_PASS_* aliases). Keys are llama-server's long CLI flags without
; the leading "--" (e.g. --n-gpu-layers 99 -> n-gpu-layers = 99). host / port /
; api-key are owned by the router, so they are omitted here.
;
; EDIT the `model` / `mmproj` paths below to your GGUF locations before running.
; ===========================================================================

version = 1

; Global defaults shared by every model (a per-section key overrides these).
[*]
flash-attn = on
seed = 42

; ─── Backend serving models — kept resident via load-on-startup ───

[Support_Agent_Qwen3.6]
model = C:\Users\User_11\Desktop\HIWIN\Models\Qwen3.6-35B-A3B-UD-Q4_K_XL_MTP.gguf
mmproj = C:\Users\User_11\Desktop\HIWIN\Models\mmproj-35BA3B.gguf
chat-template-kwargs = {"enable_thinking":true}
reasoning-format = deepseek
ctx-size = 128000
parallel = 1
threads = 1
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.00
presence-penalty = 1.5
spec-type = draft-mtp
spec-draft-n-max = 2
load-on-startup = true

[Embedding_Qwen3.6]
model = C:\Users\User_11\Desktop\HIWIN\Models\Qwen3-Embedding-4B-Q8_0.gguf
embedding = true
pooling = last
ubatch-size = 4096
batch-size = 4096
n-gpu-layers = 18
load-on-startup = true

[Reranker_Qwen3.6]
model = C:\Users\User_11\Desktop\HIWIN\Models\Qwen3-Reranker-4B-Q8_0.gguf
reranking = true
pooling = rank
ubatch-size = 4096
batch-size = 4096
n-gpu-layers = 18
load-on-startup = true

; Small, fast model for the backend's per-passage completeness enumeration
; (COMPLETENESS_MODEL). Resident alongside the big model — no swap contention.
[Support_Agent_Aux]
model = C:\Users\User_11\Desktop\HIWIN\Models\gemma-4-E4B-it-qat-UD-Q4_K_XL.gguf
chat-template-kwargs = {"enable_thinking":false}
ctx-size = 32768
parallel = 1
temp = 1.0
top-p = 0.95
top-k = 64
no-warmup = true
load-on-startup = true

; ─── Pipeline models — autoloaded on demand during ingestion ───
; No load-on-startup: they load when the pipeline first requests them. With
; --models-max 4 (the default) the four resident serving models fill VRAM; raise
; --models-max if you want the pipeline models co-resident too.

[RAG_Pipeline_Pass34]
model = C:\Users\User_11\Desktop\HIWIN\Models\Qwen3.6-35B-A3B-UD-Q4_K_XL_MTP.gguf
mmproj = C:\Users\User_11\Desktop\HIWIN\Models\mmproj-35BA3B.gguf
chat-template-kwargs = {"enable_thinking":false}
ctx-size = 100000
parallel = 5
temp = 0.7
top-p = 0.8
top-k = 20
min-p = 0.00
presence-penalty = 1.5
n-gpu-layers = 99
batch-size = 8192
ubatch-size = 8192
mmproj-offload = true

[RAG_Pipeline_Pass5Ingest]
model = C:\Users\User_11\Desktop\HIWIN\Models\gemma-4-E4B-it-qat-UD-Q4_K_XL.gguf
chat-template-kwargs = {"enable_thinking":false}
ctx-size = 100000
parallel = 5
temp = 1.0
top-p = 0.95
top-k = 64
n-gpu-layers = 99
