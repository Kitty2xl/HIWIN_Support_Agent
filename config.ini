; ===========================================================================
; llama.cpp ROUTER-MODE preset for the HIWIN Support Agent.
;
; Start the inference server in router mode (note: NO -m / model path):
;     llama-server --models-preset config.ini --host 127.0.0.1 --port 11400
; start.bat / start.sh do this for you. The router keeps every model with
; `load-on-startup = true` resident behind ONE endpoint and routes each request
; by its "model" field, so no swapping happens between the chat, embedding,
; reranker and small "aux" models.
;
; Section name = the routable model name. It MUST equal the name the apps ask
; for: backend .env LANGUAGE_MODEL / EMBEDDING_MODEL / RERANKER_MODEL /
; COMPLETENESS_MODEL and pipeline settings.json MODEL_PASS_* / EMBED_MODEL.
; Keys are llama-server's long CLI flags without the leading "--"
; (--n-gpu-layers 99  ->  n-gpu-layers = 99). host / port / api-key belong to
; the router command line, so they are not set here.
;
; >>> ON A NEW MACHINE: change every `model =`, `mmproj =`, `model-draft =` and
; >>> `chat-template-file =` path below, then run `python doctor.py` - it checks
; >>> that every file exists and every required section name is present.
;
; This file mirrors the configuration that has been running in production
; (C:\Users\User_11\Desktop\HIWIN\Models\config.ini); the comments record WHY
; each non-default value is there, so do not "clean them up".
; ===========================================================================

version = 1

; Global defaults shared by every model (a per-section key overrides these).
[*]
flash-attn = on
seed = 42
; Pin every model to ONE GPU on a shared multi-GPU box. Without this llama.cpp's
; default split-mode=layer spreads each model across every visible GPU; on
; 2026-08-26 a 4.4 GB slice landed on a card running another user's job and
; question latency went from 71 s to over 36 min. The whole serving stack is
; ~47 GB and fits on one 48 GB card. The launchers set CUDA_VISIBLE_DEVICES=0
; instead (edit them to pick a different card); uncomment `device` only if you
; prefer to pin here. NOTE: CUDA0 is a CUDA index, not an nvidia-smi index.
; device = CUDA0

; ─── Backend serving models - kept resident via load-on-startup ──────────────

[Support_Agent_Qwen3.6]
model = C:\Users\User_11\Desktop\HIWIN\Models\Qwen3.6-35B-A3B-UD-Q4_K_XL_MTP.gguf
mmproj = C:\Users\User_11\Desktop\HIWIN\Models\mmproj-35BA3B.gguf
; Custom chat template: fixes tool-call parsing for this model family. Keep it
; next to the repo (templates/qwen.jinja) and point at it with an ABSOLUTE path.
chat-template-file = C:\Users\User_11\Desktop\HIWIN\HIWIN_Dem\HIWIN_Support_Agent\templates\qwen.jinja
chat-template-kwargs = {"enable_thinking":true}
reasoning-format = deepseek
; Cap thinking so a runaway cannot eat the whole context. On 2026-08-14 three
; questions generated 112k-145k tokens of reasoning and returned EMPTY content.
; Across 338 successful generations the largest was 7,465 tokens (p99 5,672),
; so 8192 truncates none of them while stopping the failure early.
reasoning-budget = 8192
ctx-size = 150000
parallel = 1
threads = 1
temp = 0.0
top-p = 0.95
top-k = 20
min-p = 0.00
presence-penalty = 1.5
spec-type = draft-mtp
spec-draft-n-max = 2
load-on-startup = true
ubatch-size = 4096
batch-size = 4096
n-gpu-layers = 99
mmproj-offload = false

[Embedding_Qwen3.6]
model = C:\Users\User_11\Desktop\HIWIN\Models\Qwen3-Embedding-4B.i1-Q4_K_S.gguf
embedding = true
pooling = last
; parallel = 1 (was 4): with several slots, IDENTICAL requests land on rotating
; slots at different offsets in the unified KV buffer and return slightly
; DIFFERENT vectors (measured: 3-4 distinct vectors for the same text), which
; made retrieval rankings wobble. One slot = bit-identical outputs. It only
; costs ingestion throughput.
parallel = 1
ctx-size = 16384
ubatch-size = 4096
batch-size = 4096
n-gpu-layers = 20
load-on-startup = true

[Reranker_Qwen3.6]
model = C:\Users\User_11\Desktop\HIWIN\Models\Qwen3-Reranker-4B.i1-Q4_K_S.gguf
reranking = true
pooling = rank
; parallel = 1 for the same determinism reason as the embedding model.
parallel = 1
ctx-size = 65536
ubatch-size = 4096
batch-size = 4096
n-gpu-layers = 20
load-on-startup = true

; Small, fast model for the backend's per-passage completeness enumeration
; (.env COMPLETENESS_MODEL). Resident alongside the big model - no swapping.
[Support_Agent_Aux]
model = C:\Users\User_11\Desktop\HIWIN\Models\gemma-4-E4B-it-qat-UD-Q4_K_XL.gguf
; Optional MTP draft model for speculative decoding; delete these two lines
; (model-draft, spec-type) if you do not have the file.
model-draft = C:\Users\User_11\Desktop\HIWIN\Models\mtp-gemma-4-E4B-it.gguf
spec-type = draft-mtp
spec-draft-n-max = 4
chat-template-kwargs = {"enable_thinking":false}
ctx-size = 100000
; parallel = 1 for determinism (see the embedding section). With one slot,
; .env COMPLETENESS_CONCURRENCY > 1 simply queues; raise `parallel` (and split
; ctx-size across the slots) if you want true concurrency here.
parallel = 1
temp = 1.0
top-p = 0.95
top-k = 64
no-warmup = true
load-on-startup = true
n-gpu-layers = 99

; ─── Pipeline models - loaded on demand during ingestion ─────────────────────
; No load-on-startup: they load when the pipeline first requests them. With the
; router's default --models-max 4 the four resident serving models already fill
; the slots, so a pipeline model evicts one of them (LRU). Set MODELS_MAX=6 in
; start.bat / start.sh (or pass --models-max 6) when you run the pipeline while
; serving, VRAM permitting.

[RAG_Pipeline_Pass34]
model = C:\Users\User_11\Desktop\HIWIN\Models\Qwen3.6-35B-A3B-UD-Q4_K_XL_MTP.gguf
mmproj = C:\Users\User_11\Desktop\HIWIN\Models\mmproj-35BA3B.gguf
chat-template-kwargs = {"enable_thinking":false}
ctx-size = 100000
parallel = 5
temp = 0.7
top-p = 0.8
top-k = 20
min-p = 0.00
presence-penalty = 1.5
n-gpu-layers = 99
batch-size = 8192
ubatch-size = 8192
mmproj-offload = true

[RAG_Pipeline_Pass5Ingest]
model = C:\Users\User_11\Desktop\HIWIN\Models\gemma-4-E4B-it-qat-UD-Q4_K_XL.gguf
chat-template-kwargs = {"enable_thinking":false}
ctx-size = 100000
parallel = 4
temp = 1.0
top-p = 0.95
top-k = 64
n-gpu-layers = 99
